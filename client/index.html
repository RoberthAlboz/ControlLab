<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;700;800&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Mr+Dafoe&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#c4080c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Control Lab — livro didático digital de ferramentaria com módulos guiados para alunos e controle de estoque para docentes." />
    <title>Control Lab — Ferramentaria</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura (o ThemeProvider repete isso depois).
      try {
        if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <style>
      /* Tela de carregamento: usada pelo splash abaixo (antes do JS) e pelo componente
         BootScreen, com a mesma marcação — a troca do HTML para o React não pisca. */
      .boot { position: fixed; z-index: 100; inset: 0; display: grid; place-items: center; padding: 24px; background: #fff6f6; color: #000; font-family: Gotham, Montserrat, system-ui, sans-serif; }
      html.dark .boot { background: #151312; color: #fffaf3; }
      .boot-stack { display: grid; justify-items: center; gap: 18px; text-align: center; }
      .boot-stack.is-entering { animation: boot-in 420ms 180ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      .boot-mark { position: relative; display: grid; width: 88px; height: 88px; place-items: center; }
      .boot-mark::before { position: absolute; inset: -14px; border-radius: 50%; background: radial-gradient(closest-side, rgba(196, 8, 12, 0.16), transparent); content: ""; animation: boot-pulse 2.45s ease-in-out infinite; }
      .boot-mark svg { position: relative; width: 76px; height: 76px; filter: drop-shadow(0 6px 14px rgba(196, 8, 12, 0.28)); animation: boot-tick 4.9s infinite; }
      .boot-word { display: grid; justify-items: end; line-height: 1; }
      .boot-word b { font: 800 1.7rem/1 "League Spartan", Montserrat, sans-serif; letter-spacing: -0.03em; }
      .boot-word i { margin: -0.25em -0.35em 0 0; color: #c4080c; font: 400 1.75rem/1 "Mr Dafoe", cursive; }
      html.dark .boot-word i { color: #f0575c; }
      .boot-bar { position: relative; width: 168px; height: 3px; overflow: hidden; border-radius: 999px; background: rgba(196, 8, 12, 0.14); }
      .boot-bar::after { position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: inherit; background: linear-gradient(90deg, #8e0707, #c4080c); content: ""; animation: boot-bar 1.4s cubic-bezier(0.65, 0, 0.35, 1) var(--boot-bar-delay, 0ms) infinite; }
      .boot-label { max-width: 34ch; margin: 0; color: #68625d; font-size: 0.875rem; font-weight: 600; line-height: 1.45; }
      html.dark .boot-label { color: #c0b8ae; }
      .boot-retry { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 16px; border: 1px solid rgba(196, 8, 12, 0.45); border-radius: 999px; background: transparent; color: #8e0707; font: 600 0.875rem Gotham, Montserrat, system-ui, sans-serif; cursor: pointer; }
      .boot-retry:hover { background: rgba(196, 8, 12, 0.08); }
      .boot-retry:focus-visible { outline: 2px solid #c4080c; outline-offset: 2px; }
      html.dark .boot-retry { color: #ff8a8e; }
      /* Gira em "catraca": um dente (1/7 de volta) por vez. */
      @keyframes boot-tick {
        0% { transform: rotate(0deg); animation-timing-function: cubic-bezier(0.65, 0, 0.25, 1); }
        14.29% { transform: rotate(51.43deg); animation-timing-function: cubic-bezier(0.65, 0, 0.25, 1); }
        28.57% { transform: rotate(102.86deg); animation-timing-function: cubic-bezier(0.65, 0, 0.25, 1); }
        42.86% { transform: rotate(154.29deg); animation-timing-function: cubic-bezier(0.65, 0, 0.25, 1); }
        57.14% { transform: rotate(205.71deg); animation-timing-function: cubic-bezier(0.65, 0, 0.25, 1); }
        71.43% { transform: rotate(257.14deg); animation-timing-function: cubic-bezier(0.65, 0, 0.25, 1); }
        85.71% { transform: rotate(308.57deg); animation-timing-function: cubic-bezier(0.65, 0, 0.25, 1); }
        100% { transform: rotate(360deg); }
      }
      @keyframes boot-pulse { 50% { opacity: 0.45; transform: scale(0.9); } }
      @keyframes boot-bar { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      @keyframes boot-in { from { opacity: 0; transform: translateY(6px); } }
      @media (prefers-reduced-motion: reduce) {
        .boot *, .boot *::before, .boot *::after { animation: none !important; }
        .boot-bar::after { width: 100%; opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-busy="true">
        <div class="boot-stack is-entering">
          <span class="boot-mark" aria-hidden="true">
            <svg viewBox="-50 -50 100 100" focusable="false"><defs><linearGradient id="boot-g" x1="-50" y1="-50" x2="50" y2="50" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8e0707" /><stop offset="1" stop-color="#c4080c" /></linearGradient></defs><path fill="url(#boot-g)" d="M16.35 14.72L28.24 25.43A38 38 0 0 1 23.88 29.56L26.38 37.69A46 46 0 0 1 16.92 42.77L11.52 36.21A38 38 0 0 1 -0.33 38.00L-3.56 45.86A46 46 0 0 1 -14.10 43.79L-14.10 35.29A38 38 0 0 1 -24.39 29.14L-31.88 33.16A46 46 0 0 1 -38.70 24.87L-33.31 18.30A38 38 0 0 1 -37.35 7.02L-45.69 5.37A46 46 0 0 1 -45.69 -5.37L-37.35 -7.02A38 38 0 0 1 -33.31 -18.30L-38.70 -24.87A46 46 0 0 1 -31.88 -33.16L-24.39 -29.14A38 38 0 0 1 -14.10 -35.29L-14.10 -43.79A46 46 0 0 1 -3.56 -45.86L-0.33 -38.00A38 38 0 0 1 11.52 -36.21L16.92 -42.77A46 46 0 0 1 26.38 -37.69L23.88 -29.56A38 38 0 0 1 28.24 -25.43L16.35 -14.72A22 22 0 1 0 16.35 14.72Z" /><circle r="8.5" fill="url(#boot-g)" /></svg>
          </span>
          <span class="boot-word" role="img" aria-label="Control Lab"><b aria-hidden="true">control</b><i aria-hidden="true">lab</i></span>
          <span class="boot-bar" aria-hidden="true"></span>
          <p class="boot-label" role="status">Carregando…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
